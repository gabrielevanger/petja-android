name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PR que só mexe em texto (Markdown e templates do GitHub) não precisa de build nem de testes.
  # A lista é do que com certeza é texto: qualquer outro arquivo, mesmo um esquecido aqui, roda tudo.
  # Push na main e execução manual rodam sempre.
  changes:
    name: Arquivos alterados
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      somente-texto: ${{ steps.verificar.outputs.somente-texto }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Verificar se o PR só muda texto
        id: verificar
        env:
          EVENTO: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENTO" != "pull_request" ]; then
            echo "somente-texto=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/alterados"
          cat "$RUNNER_TEMP/alterados"
          if [ ! -s "$RUNNER_TEMP/alterados" ] || grep -qvE '\.md$|^\.github/ISSUE_TEMPLATE/' "$RUNNER_TEMP/alterados"; then
            echo "somente-texto=false" >> "$GITHUB_OUTPUT"
          else
            echo "somente-texto=true" >> "$GITHUB_OUTPUT"
            echo "Só texto mudou: build e testes ficam de fora." >> "$GITHUB_STEP_SUMMARY"
          fi

  android:
    name: "App: análise estática, testes e APK"
    # Job pulado conta como aprovado no ruleset. O !cancelled() faz rodar se o job acima falhar,
    # para uma falha na detecção nunca liberar o merge sem testes.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.somente-texto != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Baixar o relatório de cobertura da main, que é artefato de outra execução.
      actions: read
      # Comentar a cobertura no PR.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # 17 compila o projeto; 21 executa os testes, exigido pelo Robolectric. O último da lista é o padrão.
      - name: JDK 21 e 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Tokens da interface (sem medidas, cores e textos soltos nas telas)
        run: scripts/check-ui-tokens.sh

      - name: Análise estática (ktlint e Android Lint)
        run: ./gradlew ktlintCheck :build-logic:convention:ktlintCheck :app:lintDebug

      - name: Testes unitários
        run: ./gradlew test

      # Usa os resultados dos testes acima; falha se algum módulo ficar abaixo do piso (ver CONTRIBUTING).
      - name: Cobertura de testes (Kover)
        run: ./gradlew koverXmlReportCoverage koverHtmlReportCoverage koverVerifyCoverage

      # Na main, o XML fica guardado para os PRs compararem com ele.
      - name: Guardar cobertura da main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-xml
          path: build/reports/kover/reportCoverage.xml
          retention-days: 90

      - name: Baixar cobertura da main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name cobertura-xml --dir base-coverage \
              || echo "A última execução da main ainda não tem o relatório de cobertura."
          fi

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f build/reports/kover/reportCoverage.xml ]; then
            scripts/coverage-summary.py build/reports/kover/reportCoverage.xml base-coverage/reportCoverage.xml \
              | tee coverage-comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Um comentário só por PR: o CI acha o anterior pela marca invisível e atualiza em vez de criar outro.
      - name: Comentar cobertura no PR
        if: always() && github.event_name == 'pull_request' && hashFiles('coverage-comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- petja-coverage -->"))) | .id' \
            | head -n 1)
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '\nRelatório completo: artefato `cobertura-%s` [desta execução](%s).\n' "$GITHUB_SHA" "$run_url" \
            >> coverage-comment.md
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@coverage-comment.md > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@coverage-comment.md > /dev/null
          fi

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-${{ github.sha }}
          path: build/reports/kover/htmlCoverage/
          if-no-files-found: ignore
          retention-days: 14

      # Sem supabase.url no CI: o APK abre, mas mostra o erro de conexão na vitrine.
      - name: APK debug
        run: ./gradlew :app:assembleDebug

      - name: Publicar relatórios (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/reports/ktlint/
            app/build/reports/lint-results-debug.html
          retention-days: 7

  database:
    name: "Banco: migrações, seed e RLS"
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.somente-texto != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar PGlite
        run: npm install --no-audit --no-fund

      - name: Testes do banco
        run: npm test

  commits:
    name: Mensagens de commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # O hook local pode ser pulado com --no-verify; aqui a regra vale para todo PR.
      - name: Validar commits do PR com o hook do repositório
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::Commit $sha fora do padrão"
              status=1
            fi
          done
          exit $status
