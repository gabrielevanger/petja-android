name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: "App: análise estática, testes e APK"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 17 compila o projeto; 21 executa os testes, exigido pelo Robolectric. O último da lista é o padrão.
      - name: JDK 21 e 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Tokens da interface (sem medidas, cores e textos soltos nas telas)
        run: scripts/check-ui-tokens.sh

      - name: Análise estática (ktlint e Android Lint)
        run: ./gradlew ktlintCheck :build-logic:convention:ktlintCheck :app:lintDebug

      - name: Testes unitários
        run: ./gradlew test

      # Sem supabase.url no CI: o APK abre, mas mostra o erro de conexão na vitrine.
      - name: APK debug
        run: ./gradlew :app:assembleDebug

      - name: Publicar relatórios (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/reports/ktlint/
            app/build/reports/lint-results-debug.html
          retention-days: 7

  database:
    name: "Banco: migrações, seed e RLS"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar PGlite
        run: npm install --no-audit --no-fund

      - name: Testes do banco
        run: npm test

  commits:
    name: Mensagens de commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # O hook local pode ser pulado com --no-verify; aqui a regra vale para todo PR.
      - name: Validar commits do PR com o hook do repositório
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::Commit $sha fora do padrão"
              status=1
            fi
          done
          exit $status
